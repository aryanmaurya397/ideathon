    <path d="M50 8 C46 8 43 11 43 15 C41 15 39 17 39 20 C37 21 36 24 37 27 C36 29 37 32 39 34 C38 37 40 40 42 42 C44 44 47 46 50 46 C53 46 56 44 58 42 C60 40 62 37 61 34 C63 32 64 29 63 27 C64 24 63 21 61 20 C61 17 59 15 57 15 C57 11 54 8 50 8 Z" fill="#B45309"/>
    <!-- Center Lion Face Details -->
    <path d="M47 16 C47 14 53 14 53 16 C53 18 52 20 50 20 C48 20 47 18 47 16 Z" fill="#F59E0B"/>
    <circle cx="47" cy="18" r="1" fill="#78350F"/>
    <circle cx="53" cy="18" r="1" fill="#78350F"/>
    <path d="M48 22 L52 22 L50 25 Z" fill="#78350F"/>
    <path d="M46 27 C48 29 52 29 54 27" stroke="#78350F" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    
    <!-- Left Lion Head -->
    <path d="M36 14 C33 14 30 16 30 19 C28 20 27 23 28 26 C26 28 27 31 29 33 C28 36 30 39 33 41 C36 42 39 43 42 42 C40 39 39 35 39 32 C37 30 37 27 38 24 C38 21 39 18 41 16 C39 14 38 14 36 14 Z" fill="#92400E"/>
    <circle cx="33" cy="22" r="1" fill="#451A03"/>
    
    <!-- Right Lion Head -->
    <path d="M64 14 C67 14 70 16 70 19 C72 20 73 23 72 26 C74 28 73 31 71 33 C72 36 70 39 67 41 C64 42 61 43 58 42 C60 39 61 35 61 32 C63 30 63 27 62 24 C62 21 61 18 59 16 C61 14 62 14 64 14 Z" fill="#92400E"/>
    <circle cx="67" cy="22" r="1" fill="#451A03"/>

