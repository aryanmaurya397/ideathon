<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115" width="100%" height="100%" aria-label="State Emblem of India">
  <!-- Ashoka Lion Capital - Official Emblem Vector Representation -->
  <g fill="#0B3D91">
