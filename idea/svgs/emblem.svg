    <!-- Capital Abacus Platform -->
    <rect x="18" y="63" width="64" height="15" rx="3" fill="#0B3D91"/>
    
    <!-- Ashoka Chakra (Center of Abacus) -->
    <circle cx="50" cy="70.5" r="6" fill="#FFFFFF"/>
    <circle cx="50" cy="70.5" r="5" fill="none" stroke="#0B3D91" stroke-width="0.8"/>
    <circle cx="50" cy="70.5" r="1.2" fill="#0B3D91"/>
    <!-- Chakra Spokes (24) -->
    <g stroke="#0B3D91" stroke-width="0.5">
      <line x1="50" y1="65.5" x2="50" y2="75.5"/>
      <line x1="45" y1="70.5" x2="55" y2="70.5"/>
      <line x1="46.5" y1="67" x2="53.5" y2="74"/>
      <line x1="46.5" y1="74" x2="53.5" y2="67"/>
      <line x1="45.5" y1="68.5" x2="54.5" y2="72.5"/>
      <line x1="45.5" y1="72.5" x2="54.5" y2="68.5"/>
      <line x1="48" y1="65.8" x2="52" y2="75.2"/>
      <line x1="52" y1="65.8" x2="48" y2="75.2"/>
    </g>

    <!-- Galloping Horse (Left of Chakra) -->
    <path d="M25 72 C25 69 27 68 29 68 C31 68 33 70 33 72 C32 73 30 73 29 74 C28 75 26 75 25 74 Z" fill="#F59E0B"/>
    <path d="M24 74 L22 76 M27 75 L28 77 M31 74 L33 76" stroke="#F59E0B" stroke-width="0.8"/>

    <!-- Bull (Right of Chakra) -->
    <path d="M75 72 C75 69 73 68 71 68 C69 68 67 70 67 72 C68 73 70 73 71 74 C72 75 74 75 75 74 Z" fill="#F59E0B"/>
    <path d="M76 74 L78 76 M73 75 L72 77 M69 74 L67 76" stroke="#F59E0B" stroke-width="0.8"/>

    <!-- Lotus Base -->
    <path d="M22 79 C22 79 32 87 50 87 C68 87 78 79 78 79 C76 83 66 90 50 90 C34 90 24 83 22 79 Z" fill="#B45309"/>
    <!-- Lotus Petals -->
    <path d="M26 80 Q35 88 50 88 Q65 88 74 80" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
    <path d="M30 81 Q40 89 50 89 Q60 89 70 81" stroke="#F59E0B" stroke-width="0.8" fill="none"/>

    <!-- Motto Ribbon Platform -->
    <rect x="20" y="93" width="60" height="10" rx="2" fill="#0B3D91"/>
    <!-- Satyameva Jayate text representation -->
    <text x="50" y="100.5" font-family="'Noto Sans Devanagari', 'Inter', system-ui, sans-serif" font-size="6.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">सत्यमेव जयते</text>
