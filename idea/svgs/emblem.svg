    <path d="M43 43 C42 47 43 53 44 58 L56 58 C57 53 58 47 57 43 C55 45 53 46 50 46 C47 46 45 45 43 43 Z" fill="#B45309"/>
    <path d="M34 42 C33 46 34 52 36 58 L42 58 C41 53 40 47 41 43 C38 43 36 42 34 42 Z" fill="#92400E"/>
    <path d="M66 42 C67 46 66 52 64 58 L58 58 C59 53 60 47 59 43 C62 43 64 42 66 42 Z" fill="#92400E"/>

    <!-- Paws on Abacus -->
